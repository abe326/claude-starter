name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 公開前検査（形式。個人語リストは各マシンだけにある）
        run: python3 scripts/check_public.py --history
      - name: 単体テスト
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/tests/run_tests.py
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
