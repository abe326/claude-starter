# gitleaks の設定。既定のルールに、架空の秘密を置いているテスト用ファイルの例外だけ足す（理由は .public-allow）
[extend]
useDefault = true

[allowlist]
description = "テスト用の架空の値・検出用の正規表現"
paths = [
  '''scripts/tests/secret-cases\.txt''',
  '''scripts/tests/test_secrets\.py''',
  '''scripts/tests/test_starter\.py''',
  '''scripts/check_public\.py''',
  '''scripts/check_skeleton\.py''',
  '''\.claude/hooks/drops\.py''',
  '''\.claude/rules/secrets\.md''',
]
